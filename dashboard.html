<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Ticket Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; --sidebar-bg: #1e293b; --card-bg: #1e293b;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --accent: #f59e0b; --accent-hover: #d97706;
            --border: #334155; --input-bg: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar */
        .sidebar { width: 250px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; flex-shrink: 0; }
        .brand { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .nav-link:hover, .nav-link.active { background-color: rgba(245, 158, 11, 0.1); color: var(--accent); }
        .logout { color: #ef4444; margin-top: auto; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .stat-title { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; }

        /* Form Layout */
        .card-section { background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border); display: none; animation: fadeIn 0.3s ease; }
        .card-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .full-width { grid-column: 1 / -1; }
        
        label { font-size: 0.9rem; color: var(--text-muted); }
        input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; outline: none; width: 100%; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--accent); }
        input[type="file"] { padding: 7px; }
        
        .btn-submit { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:hover { background: var(--accent-hover); }

        /* Table Layout */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; white-space: nowrap; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: rgba(255,255,255,0.1); white-space: nowrap; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background: #dc2626; }

        /* Custom Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s ease; backdrop-filter: blur(4px); }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 90%; max-width: 400px; text-align: center; transform: scale(0.95); transition: 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-icon { font-size: 3rem; color: var(--accent); margin-bottom: 15px; }
        .modal-title { font-size: 1.2rem; margin-bottom: 10px; color: var(--text-main); font-weight: bold; }
        .modal-message { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; line-height: 1.5; }
        .modal-actions { display: flex; justify-content: center; gap: 15px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-cancel:hover { background: rgba(255,255,255,0.05); }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 15px; flex-shrink: 0; }
            .brand { margin-bottom: 15px; justify-content: center; }
            .nav-links { flex-direction: row; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
            .logout { margin-top: 0; }
            .main-content { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
            .card-section { padding: 15px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-ticket-simple"></i> SYSTEM ADMIN</div>
        <div class="nav-links">
            <a id="nav-add" class="nav-link active"><i class="fa-solid fa-plus"></i> Add Ticket</a>
            <a id="nav-inventory" class="nav-link"><i class="fa-solid fa-list"></i> Inventory</a>
            <a href="index.html" class="nav-link"><i class="fa-solid fa-desktop"></i> View Hub</a>
            <a href="#" class="nav-link logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1 id="page-title">Create Listing</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-title">Total Tickets</div><div class="stat-value" id="stat-total">0</div></div>
            <div class="stat-card"><div class="stat-title">Available</div><div class="stat-value" id="stat-avail" style="color: #10b981;">0</div></div>
            <div class="stat-card"><div class="stat-title">Sold/Reserved</div><div class="stat-value" id="stat-sold" style="color: #ef4444;">0</div></div>
        </div>

        <!-- Add Ticket Section -->
        <div id="section-add" class="card-section active">
            <form id="add-ticket-form">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Target Marketplace</label>
                        <select id="marketplace" required>
                            <option value="eplus">Eplus (Japan)</option>
                            <option value="ticketpia">Ticket Pia (Japan)</option>
                            <option value="lawson">Lawson Ticket (Japan)</option>
                            <option value="nolworld">NOL World (South Korea)</option>
                            <option value="ticketmaster">Ticketmaster (International)</option>
                        </select>
                    </div>

                    <div class="form-group"><label>Event Title</label><input type="text" id="title" required></div>
                    <div class="form-group"><label>Venue</label><input type="text" id="venue" required></div>
                    <div class="form-group"><label>Date</label><input type="date" id="date" required></div>
                    <div class="form-group"><label>Time</label><input type="time" id="time" required></div>
                    <div class="form-group"><label>Ticket Category (e.g., SS席)</label><input type="text" id="category" required></div>
                    <div class="form-group"><label>Price</label><input type="number" id="price" required></div>
                    <div class="form-group"><label>Quantity</label><input type="number" id="quantity" value="1" required></div>
                    <div class="form-group"><label>Status</label>
                        <select id="status">
                            <option value="available">Available</option>
                            <option value="reserved">Reserved</option>
                            <option value="sold">Sold</option>
                        </select>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Event Poster Image</label>
                        <input type="file" id="poster" accept="image/*" required>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> Publish to Showcase</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Inventory List Section -->
        <div id="section-inventory" class="card-section">
            <div class="table-responsive">
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th>Marketplace</th>
                            <th>Event Title</th>
                            <th>Date</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Custom Modal Overlay -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="modal-title" id="modal-title">Success</div>
            <div class="modal-message" id="modal-message">Operation completed successfully.</div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-submit" id="modal-btn-confirm">OK</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
